{{- if include "consulacl.enabled" . }}
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "consulacl.operatorNamespace" . | quote }}
  acl:
    name: {{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}
    explicitName: true
    json: >
      {
         "policies":[
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }} prefix policy",
               "Rules":"key_prefix \"config/{{ .Values.NAMESPACE }}/\" { policy = \"write\" }"
            },
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging prefix policy",
               "Rules":"key_prefix \"logging/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/\" { policy = \"read\" }"
            }
         ],
         "roles":[
            {
               "Name":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
               "Description":"{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }} role",
               "policy_names":[
                  "{{ .Values.NAMESPACE }}_global_shared_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_v2",
                  "{{ .Values.NAMESPACE }}_{{ .Values.SERVICE_NAME }}_logging_v2",
                  "{{ .Values.ORIGIN_NAMESPACE }}_read_bluegreen_v2",
{{- if .Values.PEER_NAMESPACE }}
                  "{{ .Values.PEER_NAMESPACE }}_read_bluegreen_v2",
{{- end }}
                  "{{ .Values.NAMESPACE }}_read_composite_v2",
                  "{{ .Values.NAMESPACE }}_write_global_v2",
                  "{{ .Values.NAMESPACE }}_sessions_v2"
               ]
            }
         ]
      }
---
apiVersion: netcracker.com/v1
kind: ConsulKV
metadata:
  name: {{ .Values.SERVICE_NAME }}
  namespace: {{ .Values.NAMESPACE }}
  labels:
    deployer.cleanup/allow: "true"
spec:
  operatorNamespace: {{ include "consulacl.operatorNamespace" . | quote }}
  kv:
    - key: "config/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
    - key: "data/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
    - key: "logging/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}/"
{{- end }}
