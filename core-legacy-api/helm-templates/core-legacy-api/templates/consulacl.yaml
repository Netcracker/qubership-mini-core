{{- if include "coretpl.consulAclEnabled" $ }}
---
apiVersion: netcracker.com/v1
kind: ConsulACL
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/part-of: 'Cloud-Core'
    app.kubernetes.io/managed-by: 'saasDeployer'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
  operatorNamespace: {{ include "coretpl.consulNamespace" $ | quote }}
  acl:
    name: '{{ .Values.SERVICE_NAME }}'
    json: >
      {
        "policies": [
          {"Name": "config-write", "Rules": "key_prefix \"config/{{ .Values.NAMESPACE }}/\" { policy = \"write\" }"},
          {"Name": "logging-read", "Rules": "key_prefix \"logging/{{ .Values.NAMESPACE }}/{{ .Values.SERVICE_NAME }}\" { policy = \"read\" }"}
        ],
        "roles": [{"Name": "service", "policy_names": ["config-write", "logging-read"]}],
        "bind_rules": [{"BindName": "service", "ServiceAccountName": "{{ .Values.SERVICE_NAME }}"}]
      }
{{- end }}
