MEMORY_LIMIT: "80Mi"
MEMORY_REQUEST: "80Mi"
CPU_REQUEST: "100m"
CPU_LIMIT: "100m"
REPLICAS: 2
HPA_ENABLED: true
HPA_AVG_CPU_UTILIZATION_TARGET_PERCENT: 75
HPA_SCALING_UP_STABILIZATION_WINDOW_SECONDS: 60
HPA_SCALING_UP_PODS_PERIOD_SECONDS: 60
HPA_SCALING_UP_PODS_VALUE: 1
HPA_SCALING_DOWN_STABILIZATION_WINDOW_SECONDS: 300
HPA_SCALING_DOWN_PODS_PERIOD_SECONDS: 60
HPA_SCALING_DOWN_PODS_VALUE: 1
HPA_MIN_REPLICAS: 2
HPA_MAX_REPLICAS: 5
HPA_SCALING_UP_SELECT_POLICY: Max
HPA_SCALING_DOWN_SELECT_POLICY: Max
HPA_SCALING_UP_PERCENT_PERIOD_SECONDS: -1
HPA_SCALING_DOWN_PERCENT_PERIOD_SECONDS: -1

# Startup probe defaults. A value of -1 signifies that the parameter is undefined and the default value is used.
PROBE_STARTUP_INITIAL_DELAY_SECONDS: -1
PROBE_STARTUP_TIMEOUT_SECONDS: -1
PROBE_STARTUP_PERIOD_SECONDS: -1
PROBE_STARTUP_FAILURE_THRESHOLD: -1

# Liveness probe defaults. A value of -1 signifies that the parameter is undefined and the default value is used.
PROBE_LIVENESS_INITIAL_DELAY_SECONDS: -1
PROBE_LIVENESS_TIMEOUT_SECONDS: -1
PROBE_LIVENESS_PERIOD_SECONDS: -1
PROBE_LIVENESS_FAILURE_THRESHOLD: -1

# Readiness probe defaults. A value of -1 signifies that the parameter is undefined and the default value is used.
PROBE_READINESS_INITIAL_DELAY_SECONDS: -1
PROBE_READINESS_TIMEOUT_SECONDS: -1
PROBE_READINESS_PERIOD_SECONDS: -1
PROBE_READINESS_SUCCESS_THRESHOLD: -1
PROBE_READINESS_FAILURE_THRESHOLD: -1
